name: playerpath
description: PlayerPath - Grassroots Football Recruitment Platform
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.6.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  glassmorphism: ^3.0.0
  animations: ^2.0.11
  lottie: ^3.1.3
  intl: ^0.20.0

  # Media
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Push Notifications
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6

  # Utils
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  share_plus: ^12.0.2
  pdf: ^3.13.0
  printing: ^5.15.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  retrofit_generator: ^10.0.0
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
