workflows:
  # ──────────────────────────────────────────────
  # iOS Build — sends to your iPhone via TestFlight
  # ──────────────────────────────────────────────
  ios-build:
    name: PlayerPath iOS
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test --no-pub || echo "⚠️  Tests not yet written — skipping"
      - name: Build iOS (release)
        script: flutter build ipa --release --export-options-plist ios/exportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - playerpath@example.com
        notify:
          success: true
          failure: true

  # ──────────────────────────────────────────────
  # iOS Dev Build — for personal device (no signing)
  # Use this first to validate the build works
  # ──────────────────────────────────────────────
  ios-debug-build:
    name: PlayerPath iOS Debug
    max_build_duration: 30
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build iOS debug
        script: flutter build ios --debug --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
