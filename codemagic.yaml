workflows:
  # ═══════════════════════════════════════════
  # iOS — TestFlight Release
  # ═══════════════════════════════════════════
  ios-release:
    name: iOS Release → TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Run tests
        script: flutter test --no-pub
        ignore_failure: true
      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(git rev-list --count HEAD) + 1))
          echo "Build number: $BUILD_NUMBER"
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist ios/exportOptions.plist \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list --count HEAD) + 1))
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - $NOTIFY_EMAIL
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════
  # Android — Google Play (Internal Track)
  # ═══════════════════════════════════════════
  android-release:
    name: Android Release → Google Play
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - google_play_credentials
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test --no-pub
        ignore_failure: true
      - name: Build App Bundle
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list --count HEAD) + 1))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - $NOTIFY_EMAIL
        notify:
          success: true
          failure: true

  # ═══════════════════════════════════════════
  # Combined — Build both platforms
  # ═══════════════════════════════════════════
  release:
    name: Full Release (iOS + Android)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
        - google_play_credentials
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
      - name: Run all tests
        script: flutter test --no-pub
        ignore_failure: true
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist ios/exportOptions.plist \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list --count HEAD) + 1))
      - name: Build Android AAB
        script: |
          flutter build appbundle --release \
            --build-name=1.0.0 \
            --build-number=$(($(git rev-list --count HEAD) + 1))
    artifacts:
      - build/ios/ipa/*.ipa
      - build/app/outputs/bundle/release/*.aab
