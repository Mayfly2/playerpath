workflows:
  # ──────────────────────────────────────────────
  # iOS Dev Build — for personal device (no signing)
  # Use this first to validate the build works
  # ──────────────────────────────────────────────
  ios-debug-build:
    name: PlayerPath iOS Debug
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter
        script: |
          if [ ! -d "$HOME/flutter" ]; then
            git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          fi
          export PATH="$HOME/flutter/bin:$PATH"
          flutter doctor
      - name: Install dependencies
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd mobile
          flutter pub get
      - name: Build iOS debug
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd mobile
          flutter build ios --debug --no-codesign
    artifacts:
      - mobile/build/ios/iphoneos/Runner.app

  # ──────────────────────────────────────────────
  # iOS Release Build — TestFlight
  # ──────────────────────────────────────────────
  ios-build:
    name: PlayerPath iOS Release
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install Flutter
        script: |
          if [ ! -d "$HOME/flutter" ]; then
            git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter
          fi
          export PATH="$HOME/flutter/bin:$PATH"
          flutter doctor
      - name: Install dependencies
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd mobile
          flutter pub get
      - name: Run tests
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd mobile
          flutter test --no-pub || echo "Tests not written yet — skipping"
      - name: Build iOS
        script: |
          export PATH="$HOME/flutter/bin:$PATH"
          cd mobile
          flutter build ipa --release --export-options-plist ios/exportOptions.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
      email:
        recipients:
          - playerpath@example.com
        notify:
          success: true
          failure: true
